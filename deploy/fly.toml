app = "ihelp-nps"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_SUPABASE_URL = "placeholder"
    VITE_SUPABASE_ANON_KEY = "placeholder"

[env]
  PORT = "80"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
