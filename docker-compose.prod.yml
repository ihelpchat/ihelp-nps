version: '3.8'

# Docker Compose para ambiente de produção
# Uso: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  ihelp-nps:
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
